<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Credential ownership versus delegated capability</title><desc id="d">Comparison between a long-lived secret inside an agent and delegated short-lived access enforced outside the agent.</desc><rect width="1200" height="620" fill="#f7f7f4"/><text x="60" y="64" font-family="monospace" font-size="18" fill="#6b6b65">THE SECURITY BOUNDARY</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="600" fill="#11110f">Credential ownership vs. delegated capability</text><g transform="translate(60 160)"><rect width="500" height="370" rx="10" fill="#ecece6" stroke="#c7c7bf"/><text x="28" y="42" font-family="monospace" font-size="16" fill="#6b6b65">COMMON DEFAULT</text><rect x="55" y="92" width="170" height="95" rx="8" fill="#11110f"/><text x="140" y="133" text-anchor="middle" fill="#f7f7f4" font-family="Arial" font-size="22">Agent</text><text x="140" y="161" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">API_KEY=••••</text><path d="M225 140H380" stroke="#11110f" stroke-width="3"/><path d="M365 128l18 12-18 12" fill="none" stroke="#11110f" stroke-width="3"/><rect x="380" y="92" width="82" height="95" rx="8" fill="#fff" stroke="#aaa"/><text x="421" y="145" text-anchor="middle" font-family="monospace" font-size="13">API</text><text x="55" y="238" font-family="Arial" font-size="19" fill="#11110f">One compromise inherits the token's</text><text x="55" y="267" font-family="Arial" font-size="19" fill="#11110f">full lifetime and blast radius.</text><text x="55" y="323" font-family="monospace" font-size="15" fill="#8a3c31">SECRET + DECISION + EXECUTION</text></g><g transform="translate(640 160)"><rect width="500" height="370" rx="10" fill="#11110f"/><text x="28" y="42" font-family="monospace" font-size="16" fill="#9b9b92">DELEGATED MODEL</text><rect x="35" y="92" width="120" height="95" rx="8" fill="#f7f7f4"/><text x="95" y="145" text-anchor="middle" fill="#11110f" font-family="Arial" font-size="20">Agent</text><path d="M155 140H235" stroke="#f7f7f4" stroke-width="3" stroke-dasharray="8 7"/><rect x="235" y="82" width="130" height="115" rx="8" fill="#252521" stroke="#77776e"/><text x="300" y="126" text-anchor="middle" fill="#f7f7f4" font-family="Arial" font-size="18">Policy +</text><text x="300" y="150" text-anchor="middle" fill="#f7f7f4" font-family="Arial" font-size="18">identity</text><text x="300" y="178" text-anchor="middle" fill="#9b9b92" font-family="monospace" font-size="12">OIDC</text><path d="M365 140H420" stroke="#f7f7f4" stroke-width="3"/><rect x="420" y="92" width="55" height="95" rx="8" fill="#f7f7f4"/><text x="447" y="145" text-anchor="middle" fill="#11110f" font-family="monospace" font-size="12">API</text><text x="35" y="238" font-family="Arial" font-size="19" fill="#f7f7f4">Authority is resolved at action time,</text><text x="35" y="267" font-family="Arial" font-size="19" fill="#f7f7f4">scoped and short-lived.</text><text x="35" y="323" font-family="monospace" font-size="15" fill="#b9d8b3">IDENTITY → POLICY → TOKEN → ACTION</text></g><text x="60" y="585" font-family="monospace" font-size="16" fill="#6b6b65">THE MODEL CAN REQUEST AUTHORITY. IT SHOULD NOT BE THE AUTHORITY BOUNDARY.</text></svg>