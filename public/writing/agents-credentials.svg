<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Agents Shouldn't Own Credentials</title><desc id="d">A credential key stays outside an agent runtime while short-lived capability tokens cross a trust boundary.</desc><rect width="1200" height="675" fill="#11110f"/><g stroke="#34342f" stroke-width="1"><path d="M0 112H1200M0 225H1200M0 337H1200M0 450H1200M0 562H1200"/><path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="72" y="88" fill="#9b9b92" font-family="monospace" font-size="22" letter-spacing="3">FIELD NOTE 001 · IDENTITY</text><text x="72" y="190" fill="#f7f7f4" font-family="Arial,sans-serif" font-size="62" font-weight="600">Agents shouldn't</text><text x="72" y="258" fill="#f7f7f4" font-family="Arial,sans-serif" font-size="62" font-weight="600">own credentials.</text><g transform="translate(80 360)"><rect width="250" height="160" rx="8" fill="#1b1b18" stroke="#77776e"/><circle cx="125" cy="63" r="31" fill="none" stroke="#f7f7f4" stroke-width="5"/><path d="M103 106h44M125 94v38" stroke="#f7f7f4" stroke-width="5"/><text x="125" y="148" text-anchor="middle" fill="#9b9b92" font-family="monospace" font-size="17">AGENT RUNTIME</text></g><path d="M365 440H705" stroke="#f7f7f4" stroke-width="3" stroke-dasharray="10 10"/><path d="M685 426l22 14-22 14" fill="none" stroke="#f7f7f4" stroke-width="3"/><text x="535" y="412" text-anchor="middle" fill="#9b9b92" font-family="monospace" font-size="17">SHORT-LIVED CAPABILITY</text><g transform="translate(750 360)"><rect width="360" height="160" rx="8" fill="#f7f7f4"/><circle cx="85" cy="65" r="28" fill="none" stroke="#11110f" stroke-width="6"/><path d="M112 65h76M164 65v28M185 65v18" stroke="#11110f" stroke-width="6"/><text x="180" y="126" text-anchor="middle" fill="#11110f" font-family="monospace" font-size="17">AUTHORITY STAYS OUTSIDE</text></g><text x="72" y="615" fill="#9b9b92" font-family="monospace" font-size="20">IDENTITY → POLICY → EPHEMERAL ACCESS → ACTION</text></svg>